services:
    linuxserver:
        container_name: jackett
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=CET
        ports:
            - '9117:9117'
        volumes:
            - '/dockerConfig/Jackett:/config'
        restart: unless-stopped
        image: 'lscr.io/linuxserver/jackett:latest'
