services:
    app:
        container_name: npm
        ports:
            - '80:80'
            - '443:443'
            - '81:81'
        environment:
            - TZ=CET
            - PUID=1000
            - PGID=1000
        restart: unless-stopped
        volumes:
            - '/dockerConfig/NgnixProxyManager/data:/data'
            - '/dockerConfig/NgnixProxyManager/letsencrypt:/etc/letsencrypt'
        image: 'jc21/nginx-proxy-manager:latest'
