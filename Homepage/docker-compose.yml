services:
  homepage:
    container_name: homepage
    environment:
      - PUID=1000
      - PGID=996
      - TZ=CET
      - HOMEPAGE_ALLOWED_HOSTS=192.168.1.89:3000
    ports:
      - 3000:3000
    env_file: .env
    volumes:
      - /dockerConfig/Homepage/config:/app/config
      - /dockerConfig/Homepage/images:/app/public/images
      - /dockerConfig/Homepage/icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv:/srv:ro
    restart: unless-stopped
    image: ghcr.io/gethomepage/homepage:latest
