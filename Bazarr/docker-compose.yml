services:
    bazarr:
        container_name: bazarr
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=CET
        ports:
            - '6767:6767'
        volumes:
            - '/dockerConfig/Bazarr:/config'
            - '/srv/media/Filmovi:/movies'
            - '/srv/media/Serije:/tv'
            - '/srv/media/Anime:/anime'
        restart: unless-stopped
        image: 'lscr.io/linuxserver/bazarr:latest'
