services:
    jellyseerr:
       image: ghcr.io/seerr-team/seerr:latest
       container_name: seerr
       environment:
            - LOG_LEVEL=debug
            - TZ=CET
       ports:
            - 5055:5055
       volumes:
            - /dockerConfig/Jellyseerr:/app/config
            - /dockerConfig/Jellyseerr/cache:/app/.next/cache
       restart: unless-stopped
