version: '3.3'
services:
    portainer-ce:
        container_name: portainer
        ports:
            - '9000:9000'
        volumes:
            - '/var/run/docker.sock:/var/run/docker.sock'
            - '/dockerConfig/Portainer:/data'
        image: 'portainer/portainer-ee:latest'
        restart: unless-stopped
